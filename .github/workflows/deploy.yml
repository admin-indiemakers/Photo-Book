name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main  # Triggers the pipeline whenever code is pushed or merged to main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_rKlwszE5UXezTad8DTeNVyRD
      VERCEL_PROJECT_ID: prj_oHtuLn5t7KncvDGKFVukkeEyb2qm
    steps:
      # 1. Pull the latest code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install your dependencies cleanly
      - name: Install Dependencies
        run: npm install

      # 4. Run your test suites (Crucial gate before production)
      - name: Run Tests
        run: npm run test --if-present

      # 5. Deploy to Vercel (Production) using the robust Vercel Action
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_rKlwszE5UXezTad8DTeNVyRD
          vercel-project-id: prj_oHtuLn5t7KncvDGKFVukkeEyb2qm
          vercel-args: '--prod --yes'