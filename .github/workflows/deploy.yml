name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main  # Triggers the pipeline whenever code is pushed or merged to main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the latest code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install your dependencies cleanly
      - name: Install Dependencies
        run: npm install

      # 4. Run your test suites (Crucial gate before production)
      - name: Run Tests
        run: npm run test --if-present

      # 5. Pull production environment details from Vercel
      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_rKlwszE5UXezTad8DTeNVyRD
          VERCEL_PROJECT_ID: prj_oHtuLn5t7KncvDGKFVukkeEyb2qm

      # 6. Build the application artifacts locally using Vercel CLI
      - name: Build Project Artifacts
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_rKlwszE5UXezTad8DTeNVyRD
          VERCEL_PROJECT_ID: prj_oHtuLn5t7KncvDGKFVukkeEyb2qm

      # 7. Deploy the pre-built application directly to Vercel production
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_rKlwszE5UXezTad8DTeNVyRD
          VERCEL_PROJECT_ID: prj_oHtuLn5t7KncvDGKFVukkeEyb2qm